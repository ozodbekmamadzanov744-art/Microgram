spring:
  application:
    name: Microgram
  datasource:
    url: jdbc:h2:file:./data/microgram;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
  freemarker:
    suffix: .ftlh
    expose-request-attributes: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: 8080
logging:
  file:
    name: logs/microgram.log
